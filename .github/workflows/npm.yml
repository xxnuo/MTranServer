name: Publish to NPM

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  native:
    uses: ./.github/workflows/native-ssru.yml
    permissions:
      contents: read
      actions: read
  publish:
    needs: native
    runs-on: ubuntu-latest
    environment: npm-publish # Matches the npm trusted publisher
    permissions:
      contents: read
      id-token: write # Required for Trusted Publishing (provenance)
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      MTRAN_NATIVE_ARTIFACT_DIR: .tmp/release-native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Download verified native addons
        uses: actions/download-artifact@v4
        with:
          pattern: native-ssru-*
          path: .tmp/release-native
          merge-multiple: true

      - name: Sync version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            bun run bump "${GITHUB_REF#refs/tags/}"
          fi

      - name: Build Library
        run: bun run build:lib

      - name: Publish to NPM
        run: npm publish --provenance --access public
