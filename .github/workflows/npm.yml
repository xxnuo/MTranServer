name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  native:
    uses: ./.github/workflows/native-ssru.yml
    permissions:
      contents: read
      actions: read
  publish:
    needs: native
    runs-on: ubuntu-latest
    environment: npm-publish # Requires manual approval in GitHub Settings
    permissions:
      contents: read
      id-token: write # Required for Trusted Publishing (provenance)
    env:
      MTRAN_NATIVE_ARTIFACT_DIR: .tmp/release-native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: bun install

      - name: Download verified native addons
        uses: actions/download-artifact@v4
        with:
          pattern: native-ssru-*
          path: .tmp/release-native
          merge-multiple: true

      - name: Build Library
        run: bun run build:lib

      - name: Publish to NPM
        run: npm publish --provenance --access public
