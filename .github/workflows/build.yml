name: Build and Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Sync version from tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="v$(grep '"version"' package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')"
          fi
          echo "Syncing version to ${VERSION}"
          bun run bump ${VERSION}

      - name: Build Server
        run: bun run build:node

      - name: Validate runtime and benchmarks
        run: bun run typecheck && bun test

  build-desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Sync version from tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="v$(grep '"version"' package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')"
          fi
          echo "Syncing version to ${VERSION}"
          bun run bump ${VERSION}

      - name: Build Desktop (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: bun run build:electron -- --linux

      - name: Build Desktop (Windows)
        if: matrix.os == 'windows-latest'
        run: bun run build:electron -- --win

      - name: Build Desktop (macOS)
        if: matrix.os == 'macos-latest'
        run: bun run build:electron -- --mac

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: release/mtranserver-desktop-*

  release:
    needs: [build-server, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Desktop Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Determine Release Tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            LATEST_TAG=$(git describe --tags --abbrev=0)
            echo "tag_name=$LATEST_TAG" >> $GITHUB_OUTPUT
            echo "Using latest tag: $LATEST_TAG"
          else
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "Using ref name: ${{ github.ref_name }}"
          fi

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Generate Release Body
        id: generate_body
        run: |
          TAG="${{ steps.tag.outputs.tag_name }}"
          REPO="${{ github.repository }}"
          # Derive version from TAG to be consistent with artifacts
          VERSION=${TAG#v} 

          # Use VERSION derived from tag instead of package.json to ensure consistency with builds
          echo "Using version: $VERSION"

          if [[ "${{ github.ref_name }}" == *"dev"* ]]; then
            WARNING=$(printf "**This is a development release. DO NOT USE IT!**\n\n")
          else
            WARNING=""
          fi

          cat > release_body.md << 'EOF'
          ${WARNING}## Desktop Client

          | Platform | Architecture | Binary |
          |----------|-------------|--------|
          | Linux | x64 | [mtranserver-desktop-${VERSION}-linux-x86_64.AppImage](https://github.com/${REPO}/releases/download/${TAG}/mtranserver-desktop-${VERSION}-linux-x86_64.AppImage) |
          | Linux | arm64 | [mtranserver-desktop-${VERSION}-linux-arm64.AppImage](https://github.com/${REPO}/releases/download/${TAG}/mtranserver-desktop-${VERSION}-linux-arm64.AppImage) |
          | Linux | x64 (deb) | [mtranserver-desktop-${VERSION}-linux-amd64.deb](https://github.com/${REPO}/releases/download/${TAG}/mtranserver-desktop-${VERSION}-linux-amd64.deb) |
          | Linux | arm64 (deb) | [mtranserver-desktop-${VERSION}-linux-arm64.deb](https://github.com/${REPO}/releases/download/${TAG}/mtranserver-desktop-${VERSION}-linux-arm64.deb) |
          | Linux | x64 (rpm) | [mtranserver-desktop-${VERSION}-linux-x86_64.rpm](https://github.com/${REPO}/releases/download/${TAG}/mtranserver-desktop-${VERSION}-linux-x86_64.rpm) |
          | Linux | arm64 (rpm) | [mtranserver-desktop-${VERSION}-linux-aarch64.rpm](https://github.com/${REPO}/releases/download/${TAG}/mtranserver-desktop-${VERSION}-linux-aarch64.rpm) |
          | macOS | x64 | [mtranserver-desktop-${VERSION}-mac-x64.dmg](https://github.com/${REPO}/releases/download/${TAG}/mtranserver-desktop-${VERSION}-mac-x64.dmg) |
          | macOS | arm64 | [mtranserver-desktop-${VERSION}-mac-arm64.dmg](https://github.com/${REPO}/releases/download/${TAG}/mtranserver-desktop-${VERSION}-mac-arm64.dmg) |
          | Windows | x64 | [mtranserver-desktop-${VERSION}-win-x64.exe](https://github.com/${REPO}/releases/download/${TAG}/mtranserver-desktop-${VERSION}-win-x64.exe) |

          > 桌面端启动后会创建一个托盘菜单，通过菜单可以方便的管理服务。

          **macOS**: 拖动安装后，如果打开 MTranServer App 提示有问题无法打开，需要运行以下命令修复：

          > **macOS**: If you see any error when opening MTranServer App after installing, run this command in Terminal App: 

          ```bash
          sudo xattr -d com.apple.quarantine "/Applications/MTranServer.app"
          ```

          ## Server

          v5 服务端请使用 Docker 或通过命令行安装。暂不提供服务端单文件可执行程序。

          > For v5 server use, choose Docker or install from the command line. Standalone server executables are not currently available.

          ```bash
          npx mtranserver@latest
          ```

          Docker image: `xxnuo/mtranserver:latest`

          ## Upgrading and Offline Use

          升级时请保留配置和翻译模型文件夹。首次使用或升级后，程序可能需要下载并准备翻译文件，请保持联网并等待完成。断网前先试译需要使用的每个翻译方向。

          > Keep your configuration and translation model folders when upgrading. First use or an upgrade may require downloading and preparing translation files. Stay online and wait for preparation to finish. Try every required translation direction before going offline.

          ## Changelog
          EOF

          sed -i "s|\${WARNING}|${WARNING}|g" release_body.md
          sed -i "s|\${REPO}|${REPO}|g" release_body.md
          sed -i "s|\${TAG}|${TAG}|g" release_body.md
          sed -i "s|\${VERSION}|${VERSION}|g" release_body.md

          if [ -f CHANGELOG.md ]; then
            echo "" >> release_body.md
            cat CHANGELOG.md >> release_body.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.tag_name }}
          body_path: release_body.md
          files: release-assets/*
          draft: false
          fail_on_unmatched_files: false
